        <H1 class="text-center"> MINECRAFT </H1>
        <h3 class="center-text"> <b>Minecraft</b>, a really famous, liked and one of the most played games was released in 2009, April.
             <br> This is a sandbox game which uses blocks and non-real life physics. It is set in a blocky world where our main goal is to beat the Ender dragon. 
        </h3>
        <h4 class="left-text"> This game is full of different creatures and some of them include <br>

        <b>Iron Golems</b><br>
        <b>Wolves/Dogs</b><br>
        <b>Cats</b><br>
        <b>And Many More...</b>
        </h4>

        <h4 class="left-text"> The game has a lot of different modes and some of them include <br>
        <b>Survival Mode</b> (The main mode of the game)<br>

        <b>Adventure Mode</b><br>
        <b>Hardcore Mode</b><br>
        <b>And Many More...</b>
        </h4>
